<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Difference</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eceef7;
            color: white;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            direction: rtl;
            flex-direction: column;
            transition: background-color 0.5s, color 0.5s;
        }
        .container {
            background-color: #702283;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        input[type="text"], select {
            width: calc(100% - 22px);
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            border: none;
            text-align: left;
            direction: ltr;
        }
        button {
            background-color: #eceef7;
            color: #702283;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #dcdfe6;
        }
        .result {
            margin-top: 20px;
            font-size: 18px;
        }
        .status {
            margin-top: 10px;
            font-weight: bold;
            font-size: 18px;
        }
        .available {
            color: green;
        }
        .not-available {
            color: red;
        }
        footer {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: #702283;
        }
        .toggleModeButton {
            position: absolute;
            top: 10px;
            left: 10px;
        }
        .welcome-message {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #702283;
            padding: 10px;
            border-radius: 5px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 3s, visibility 3s;
            width: fit-content;
            height: 25px;
            display: flex;
            align-content: center;
            flex-wrap: wrap;
        }
        .welcome-message.show {
            opacity: 1;
            visibility: visible;
        }
        .light-mode {
            background-color: #702283;
            color: #000000;
        }
        .light-mode .container {
            background-color: #eceef7;
            color: #702283;
        }
        .light-mode button {
            background-color: #702283;
            color: #eceef7;
        }
        .light-mode footer {
            color: #eceef7;
        }
        .message-close-btn {
            font-weight: 100;
            background: none;
            border: none;
            color: white;
            font-size: 10px;
            cursor: pointer;
            top: 7px;
            right: 137px;
            padding: 6px;
        }
		.radio-group {
			margin-bottom: 20px;
			text-align: right;
			display: inline-flex;
		}
        .radio-group label {
            display: block;
            margin-bottom: 10px;
            cursor: pointer;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

        أهلا بيك بتمنالك شيفت سعيد 🌹
        <button class="message-close-btn" onclick="closeWelcomeMessage()">×</button>
    </div>

    <div class="container">
        <h2>احسب الـ SLA او المدة بين التوقيتين</h2>

        <!-- أزرار الاختيار Radio Button -->
        <div class="radio-group">
            <label><input type="radio" name="calculationType" value="sla" checked> حساب SLA</label>
            <label><input type="radio" name="calculationType" value="compensation"> حساب الوقت للتعويض</label>
        </div>

        <div id="slaFields">
            <label for="location">المحافظة:</label>
            <select id="location">
                <option value="قاهرة" selected>02</option>
                <option value="بحيرة اسكندرية دقهلية">050 - 045 - 03</option>
            </select>
            <br>
            <label for="issue">أختر نوع العطل:</label>
            <select id="issue">
                <option value="1">Service Degradation</option>
                <option value="2">Logical instability</option>
                <option value="3">Unable to Obtain IP</option>
                <option value="4">Slowness</option>
                <option value="5" selected>Data Down</option>
                <option value="6">No Browsing / NAS Port ID</option>
                <option value="7">Voice Down</option>
                <option value="8">Physical instability [unstable]</option>
                <option value="9">Down Management</option>
                <option value="10">Major Fault</option>
            </select>
            <br>
        </div>

        <!-- حقل إدخال التوقيت الأول -->
		<label for="fromTime" style="display: block;">أدخل التوقيت الأول:</label>
        <input type="text" id="fromTime" placeholder="YYYY-MM-DD HH:MM AM/PM">

        <!-- حقل إدخال التوقيت الثاني -->
        <label for="toTime" id="toTimeLabel">أدخل التوقيت الثاني:</label>
        <input type="text" id="toTime" placeholder="YYYY-MM-DD HH:MM AM/PM">
        <br><br>

        <button id="calcButton">احسب المدة</button>
        <button id="resetButton">إعادة تعيين</button>

        <div class="result" id="result"></div>
        <div class="status" id="status"></div>
    </div>

    <footer>
        Created By: Kareem Mahdi
    </footer>

        // تابع التحقق من نوع الحساب المختار
function handleRadioChange() {
    const calculationType = document.querySelector('input[name="calculationType"]:checked').value;
    const slaFields = document.getElementById('slaFields');
    const toTimeField = document.getElementById('toTime');
    const toTimeLabel = document.getElementById('toTimeLabel');
    const statusDiv = document.getElementById('status');
    const resultDiv = document.getElementById('result');
    const alertMessage = document.querySelector('.alert-message');

    if (calculationType === 'sla') {
        slaFields.style.display = 'block';
        toTimeField.classList.add('hidden');
        toTimeLabel.classList.add('hidden');
        statusDiv.style.display = 'block';
        resultDiv.style.display = 'block';

        // إخفاء الرسالة التحذيرية إذا كان حساب الوقت للتعويض
        if (alertMessage) {
            alertMessage.style.display = 'none';
        }
    } else if (calculationType === 'compensation') {
		slaFields.style.display = 'none';
        toTimeField.classList.remove('hidden');
        toTimeLabel.classList.remove('hidden');
        statusDiv.style.display = 'none';
        resultDiv.style.display = 'block';

        // إخفاء الرسالة التحذيرية إذا كان حساب الوقت للتعويض
        if (alertMessage) {
            alertMessage.style.display = 'none';
        }
    }
	else {
        slaFields.style.display = 'none';
        toTimeField.classList.remove('hidden');
        toTimeLabel.classList.remove('hidden');
        statusDiv.style.display = 'none';
        resultDiv.style.display = 'none';

        // إظهار الرسالة التحذيرية إذا كان حساب الوقت للتعويض
        if (alertMessage) {
            alertMessage.style.display = 'block';
        }
    }
}



        // إعداد الحالة الافتراضية عند تحميل الصفحة
        document.addEventListener('DOMContentLoaded', function() {
            handleRadioChange();
            document.querySelectorAll('input[name="calculationType"]').forEach(input => {
                input.addEventListener('change', handleRadioChange);
            });
        });

        function parseDateTime(dateString) {
            const dateParts = dateString.split(' ');
            const date = dateParts[0];
            const time = dateParts[1];
            const ampm = dateParts[2];

            const [year, month, day] = date.split('-').map(Number);
            let [hours, minutes] = time.split(':').map(Number);

            if (ampm === 'PM' && hours !== 12) {
                hours += 12;
            } else if (ampm === 'AM' && hours === 12) {
                hours = 0;
            }

            return new Date(year, month - 1, day, hours, minutes);
        }

       function calculateDifference() {
    const fromTimeStr = document.getElementById('fromTime').value.trim();
    let toTimeStr = document.getElementById('toTime').value.trim();

    if (fromTimeStr && !toTimeStr) {
        const now = new Date();
        toTimeStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')} AM`;
        document.getElementById('toTime').value = toTimeStr;
    }

    if (fromTimeStr && toTimeStr) {
        const from = parseDateTime(fromTimeStr);
        const to = parseDateTime(toTimeStr);

        const difference = to - from;

        const totalMinutes = Math.floor(difference / (1000 * 60));
        const totalHours = totalMinutes / 60;
        const days = Math.floor(totalMinutes / (60 * 24));
        const hours = Math.floor((totalMinutes % (60 * 24)) / 60);
        const minutes = totalMinutes % 60;

        document.getElementById('result').innerText = `المدة: ${days} يوم، ${hours} ساعة، ${minutes} دقيقة.`;

        // الحصول على القيم المختارة
        const location = document.getElementById('location').value;
        const issue = document.getElementById('issue').value;

        const statusDiv = document.getElementById('status');
        
        let thresholdHours = 2;
        let thresholdDays = 'Renew 3 Days or 5 Days for HK';
        
        if (issue === '5') {
            thresholdHours = (location === 'قاهرة') ? 3 : 4;
        } else if (issue === '10') {
            thresholdDays = (days <= 3) ? 'Within 3 Days or 5 Days for HK' : 'Renew 3 Days or 5 Days for HK';
        } else {
            thresholdHours = 2;
        }

        if (issue === '10') {
            statusDiv.innerText = thresholdDays;
            statusDiv.className = thresholdDays === 'Within 3 Days or 5 Days for HK' ? 'status available' : 'status not-available';
        } else {
            if (totalHours <= thresholdHours) {
                statusDiv.innerText = "Within SLA";
                statusDiv.className = "status available";
            } else {
                statusDiv.innerText = "No Estimated Time";
                statusDiv.className = "status not-available";
            }
        }

        // إظهار الرسالة التحذيرية فقط عند حساب SLA
        if (document.querySelector('input[name="calculationType"]:checked').value === 'sla') {
            showAlertMessage('متنساش تعرض تعويض الموبايل');
        }

    } else {
        document.getElementById('result').innerText = 'يرجى إدخال توقيتين صحيحين. تأكد من التنسيق.';
        document.getElementById('status').innerText = '';
    }
}

            document.getElementById('welcomeMessage').style.display = 'none';
        }

        function showAlertMessage(message) {
            const alertDiv = document.createElement('div');
            alertDiv.className = 'alert-message';
            alertDiv.style.position = 'absolute';
            alertDiv.style.top = '10px';
            alertDiv.style.left = '50%';
            alertDiv.style.transform = 'translateX(-50%)';
            alertDiv.style.backgroundColor = '#4caf50';
            alertDiv.style.color = 'white';
            alertDiv.style.padding = '10px';
            alertDiv.style.borderRadius = '5px';
            alertDiv.style.opacity = '0';
            alertDiv.style.transition = 'opacity 3s';
            alertDiv.innerText = message;

            document.body.appendChild(alertDiv);

            setTimeout(() => {
                alertDiv.style.opacity = '1';
            }, 0);

            setTimeout(() => {
                alertDiv.style.opacity = '0';
                setTimeout(() => {
                    alertDiv.remove();
                }, 3000);
            }, 3000);
        }

        document.getElementById('calcButton').addEventListener('click', calculateDifference);
        document.getElementById('resetButton').addEventListener('click', resetFields);
        document.getElementById('toggleModeButton').addEventListener('click', toggleMode);

        // إظهار رسالة الترحيب عند تحميل الصفحة
        window.onload = function() {
            const welcomeMessage = document.getElementById('welcomeMessage');
            welcomeMessage.classList.add('show');
