<!DOCTYPE html>  
<html lang="ar">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Time Difference</title>  
    <style>  
        body {  
            font-family: Arial, sans-serif;  
            background-color: #eceef7;  
            color: white;  
            margin: 0;  
            padding: 0;  
            display: flex;  
            justify-content: center;  
            align-items: center;  
            height: 100vh;  
            direction: rtl;  
            flex-direction: column;  
        }  
        .container {  
            background-color: #702283;  
            padding: 20px;  
            border-radius: 10px;  
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);  
            text-align: center;  
            max-width: 400px;  
            width: 100%;  
        }  
        input[type="text"] , select {  
            width: calc(100% - 22px);  
            padding: 10px;  
            margin-bottom: 10px;  
            border-radius: 5px;  
            border: none;  
            text-align: left;  
            direction: ltr;  
        }   
        button {  
            background-color: #eceef7;  
            color: #702283;  
            border: none;  
            padding: 10px 20px;  
            border-radius: 5px;  
            cursor: pointer;  
            font-size: 16px;  
        }  
        button:hover {  
            background-color: #dcdfe6;  
        }  
        .result {  
            margin-top: 20px;  
            font-size: 18px;  
        }  
        .status {  
            margin-top: 10px;  
            font-weight: bold;  
            font-size: 18px;  
        }  
        .available {  
            color: green;  
        }  
        .not-available {  
            color: red;  
        }  
        footer {  
            margin-top: 20px;  
            text-align: center;  
            font-size: 14px;  
            color: #702283;  
        }  
    </style>  
</head>  
<body>  
    <div class="container">  
        <h2>احسب الفرق بين التوقيتين</h2>  

        <label for="location" >المحافظة :</label>  
        <select id="location">  
            <option value="قاهرة" selected>02</option>  
            <option value="بحيرة اسكندرية دقهلية">050 - 045 - 03</option>  
        </select>  
<br>
        <label for="issue" >أختر نوع العطل:</label>  
        <select id="issue">  
            <option value="1">Service Degradation</option>  
            <option value="2">Logical instability</option>  
            <option value="3">Unable to Obtain IP</option>  
            <option value="4">Slowness</option>  
            <option value="5" selected>Data Down</option>  
            <option value="6">No Browsing / NAS Port ID</option>  
            <option value="7">Voice Down</option>  
            <option value="8">Physical instability [unstable]</option>  
            <option value="9">Down Management</option>  
            <option value="10">Major Fault</option>  
        </select>  
		<br>

        <label for="fromTime">أدخل التوقيت الأول:</label>  
        <input type="text" id="fromTime" placeholder="YYYY-MM-DD HH:MM AM/PM">  
        
        <label for="toTime">أدخل التوقيت الثاني:</label>  
        <input type="text" id="toTime" placeholder="YYYY-MM-DD HH:MM AM/PM">  

        <button id="calcButton">احسب الفرق</button>  
        <button id="resetButton">إعادة تعيين</button>  

        <div class="result" id="result"></div>  
        <div class="status" id="status"></div>  
    </div>  

    <footer>  
        Created By: Kareem Mahdi  
    </footer>  

    <script>  
        function parseDateTime(dateString) {  
            const dateParts = dateString.split(' ');  
            const date = dateParts[0];  
            const time = dateParts[1];  
            const ampm = dateParts[2];  

            const [year, month, day] = date.split('-').map(Number);  
            let [hours, minutes] = time.split(':').map(Number);  

            if (ampm === 'PM' && hours !== 12) {  
                hours += 12;  
            } else if (ampm === 'AM' && hours === 12) {  
                hours = 0;  
            }  

            return new Date(year, month - 1, day, hours, minutes);  
        }  

        function calculateDifference() {  
            const fromTimeStr = document.getElementById('fromTime').value.trim();  
            let toTimeStr = document.getElementById('toTime').value.trim();  

            if (fromTimeStr && !toTimeStr) {  
                const now = new Date();  
                toTimeStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')} AM`;  
                document.getElementById('toTime').value = toTimeStr;  
            }  

            if (fromTimeStr && toTimeStr) {  
                const from = parseDateTime(fromTimeStr);  
                const to = parseDateTime(toTimeStr);  

                const difference = to - from;  

                const totalMinutes = Math.floor(difference / (1000 * 60));  
                const totalHours = totalMinutes / 60;  
                const days = Math.floor(totalMinutes / (60 * 24));  
                const hours = Math.floor((totalMinutes % (60 * 24)) / 60);  
                const minutes = totalMinutes % 60;  

                document.getElementById('result').innerText = `الفرق: ${days} يوم، ${hours} ساعة، ${minutes} دقيقة.`;  

                // الحصول على القيم المختارة
                const location = document.getElementById('location').value;  
                const issue = document.getElementById('issue').value;  

                const statusDiv = document.getElementById('status');  
                
                let thresholdHours = 2;  
                let thresholdDays = 'Renew 3 Days';  
                
                if (issue === '5') {  
                    thresholdHours = (location === 'قاهرة') ? 3 : 4;  
                } else if (issue === '10') {  
                    thresholdDays = (days <= 3) ? 'Within 3 days' : 'Renew 3 Days';  
                } else {  
                    thresholdHours = 2;  
                }  

                if (issue === '10') {  
                    statusDiv.innerText = thresholdDays;  
                } else {  
                    if (totalHours <= thresholdHours) {  
                        statusDiv.innerText = "Within SLA";   
                        statusDiv.className = "status available";  
                    } else {  
                        statusDiv.innerText = "No Estimated Time";   
                        statusDiv.className = "status not-available";  
                    }  
                }  
            } else {  
                document.getElementById('result').innerText = 'يرجى إدخال توقيتين صحيحين. تأكد من التنسيق.';  
                document.getElementById('status').innerText = '';  
            }  
        }  

        document.addEventListener('DOMContentLoaded', function() {  
            document.getElementById('calcButton').addEventListener('click', calculateDifference);  
            document.getElementById('resetButton').addEventListener('click', function() {  
                document.getElementById('fromTime').value = '';  
                document.getElementById('toTime').value = '';  
                document.getElementById('result').innerText = '';  
                document.getElementById('status').innerText = '';  
            });  
        });  
    </script>  
</body>  
</html>
